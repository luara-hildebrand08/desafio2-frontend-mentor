<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
    <main>
        <article class="card">
            <picture>
                <img src="./images/image-product-mobile.jpg" alt="">
            </picture>

            <div class="card-content">

                <p class="category">PERFUME</p>

                <h1>Gabrielle Essence Eau De Parfum</h1>

                <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
            </div>

            <div class="price">
                <span class="current-price">$149.99</span>
                <span class="old-price">$169.99</span>
            </div>

            <button class="btn">
                <img src="./images/icon-cart.svg" alt="ícone Carrinho de Compras">
                Add to Cart
            </button>

        </article>
    </main>
    <footer></footer>
</body>
</html>
