<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
    <main>
        <article class="card">
            <picture>
                <img class="product" src="./images/image-product-mobile.jpg" alt="Foto do produto">
            </picture>

            <div class="card-content">

                <p class="category">PERFUME</p>

                <h1>Gabrielle Essence Eau De Parfum</h1>

                <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

                <div class="price">
                    <span class="current-price">$149.99</span>
                    <span class="old-price">$169.99</span>
                </div>

                <button class="btn">
                    <img src="./images/icon-cart.svg" alt="">
                    Add to Cart
                </button>

            </div>

        </article>
    </main>
    <footer></footer>
</body>
</html>
